name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Rebuild daily even with no code changes, so yt-dlp>=2025.1.15
    # picks up the latest release (extractors break often, e.g. HTTP 403s).
    - cron: '17 3 * * *'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: sreeh007/grabha-api:latest
